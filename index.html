<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Performance | Executive Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* --- GLOBAL STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #f8fafc;
        }

        /* --- PAGE SECTIONS --- */
        .page-section {
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            animation: fadeIn 0.6s ease-out;
            padding: 20px;
        }

        .active { display: flex; }

        /* --- GLASS CARD --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
        }

        /* --- TYPOGRAPHY & INPUTS --- */
        h1 { font-size: 2.5rem; margin-bottom: 25px; color: #38bdf8; }
        h2 { font-size: 1.8rem; margin-bottom: 10px; }
        
        .input-group { width: 100%; margin-bottom: 15px; }
        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.6);
            color: white;
            text-align: center;
            outline: none;
        }

        /* --- BUTTONS --- */
        .btn-primary {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-primary:hover { background: #7dd3fc; transform: translateY(-2px); }

        .btn-logout {
            background: rgba(248, 113, 113, 0.2);
            color: #f87171;
            border: 1px solid #f87171;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn-logout:hover { background: #f87171; color: white; }

        /* --- PAGE 2 SPECIFICS --- */
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid #38bdf8;
            margin-bottom: 20px;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 25px 0;
        }

        .metric-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .metric-value { font-size: 1.5rem; font-weight: 700; color: #38bdf8; }
        .metric-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; }

        /* --- PAGE 3: DASHBOARD --- */
        .dashboard-container { width: 95vw; height: 90vh; display: flex; flex-direction: column; }
        .iframe-wrapper { flex: 1; background: white; border-radius: 20px; overflow: hidden; }
        iframe { width: 100%; height: 100%; }

        /* --- PAGE 4: THANK YOU --- */
        .it-image {
            width: 100%;
            max-width: 350px;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <section id="page1" class="page-section active">
        <div class="glass-card">
            <h1>IT Performance</h1>
            <div class="input-group"><input type="text" id="u" placeholder="User Name"></div>
            <div class="input-group"><input type="password" id="p" placeholder="Password"></div>
            <button class="btn-primary" onclick="nav(2)">Login</button>
        </div>
    </section>

    <section id="page2" class="page-section">
        <div class="glass-card" style="max-width: 600px;">
            <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=300&q=80" alt="Flower Profile" class="profile-img">
            <h2>Executive Metrics</h2>
            
            <div class="metrics-grid">
                <div class="metric-box"><div class="metric-value">120</div><div class="metric-label">Projects</div></div>
                <div class="metric-box"><div class="metric-value">78%</div><div class="metric-label">Billability</div></div>
                <div class="metric-box"><div class="metric-value">12%</div><div class="metric-label">Attrition</div></div>
                <div class="metric-box"><div class="metric-value">4.2</div><div class="metric-label">Satisfaction</div></div>
            </div>

            <button class="btn-primary" onclick="nav(3)">Next: View Dashboard →</button>
            <button class="btn-logout" onclick="nav(1)">Logout</button>
        </div>
    </section>

    <section id="page3" class="page-section">
        <div class="dashboard-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h2 style="color: #38bdf8;">Enterprise Dashboard</h2>
                <button class="btn-logout" style="margin-top:0" onclick="nav(1)">Logout</button>
            </div>
            <div class="iframe-wrapper">
                <iframe src="https://ap2.ca.analytics.ibm.com/bi/?perspective=dashboard&amp;pathRef=.my_folders%2FPRO-Dashboard&amp;closeWindowOnLastView=true&amp;ui_appbar=false&amp;ui_navbar=false&amp;shareMode=embedded&amp;action=view&amp;mode=dashboard&amp;subView=model0000019d6e069aa3_00000000&amp;nav_filter=true"></iframe>
            </div>
            <button class="btn-primary" style="max-width: 200px; align-self: center;" onclick="nav(4)">Finish Session</button>
        </div>
    </section>

    <section id="page4" class="page-section">
        <div class="glass-card">
            <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=500&q=80" alt="IT Technology" class="it-image">
            <h1 style="font-size: 3.5rem;">Thank You!</h1>
            <p style="color: #94a3b8; margin-bottom: 20px;">Your IT Performance session has ended successfully.</p>
            <button class="btn-primary" onclick="nav(1)">Return to Login</button>
        </div>
    </section>

    <script>
        function nav(p) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.getElementById('page' + p).classList.add('active');
        }
    </script>
</body>
</html>
